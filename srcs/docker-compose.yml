services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file: .env
    volumes:
      - mariadb:/var/lib/mysql
    restart: on-failure
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${DB_ROOT_PASSWORD} --silent"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file: .env
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    env_file: .env
    ports:
      # - "8443:443"
      - "443:443"
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      - wordpress
    restart: on-failure
    networks:
      - inception

volumes:
  mariadb: {}
  wordpress: {}

networks:
  inception:
    name: inception
    driver: bridge